<!DOCTYPE html>
<html>
<head>
    <title>Test Google Sign-In</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <h1>Test Google Sign-In</h1>
    
    <div id="g_id_onload"
         data-client_id="795218195144-n69mhlhomon1j6q5eg4ofjjosn54b0mu.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    
    <div class="g_id_signin" data-type="standard"></div>
    
    <button onclick="manualSignIn()">Manual Sign-In</button>
    
    <div id="result"></div>
    
    <script>
        function handleCredentialResponse(response) {
            console.log("Encoded JWT ID token: " + response.credential);
            
            // Decode the JWT payload
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            console.log('User info:', payload);
            
            document.getElementById('result').innerHTML = `
                <h2>Sign-In Successful!</h2>
                <p>Name: ${payload.name}</p>
                <p>Email: ${payload.email}</p>
                <p>Picture: <img src="${payload.picture}" width="50" height="50"></p>
            `;
        }
        
        function manualSignIn() {
            if (window.google) {
                google.accounts.id.prompt();
            } else {
                alert('Google Sign-In not loaded');
            }
        }
        
        window.onload = function() {
            console.log('Page loaded');
            console.log('Google object:', window.google);
        };
    </script>
</body>
</html>
